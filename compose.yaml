services:
  supplier:
    build:
      context: ./supplier
      target: build
    command: ./supplier
    environment:
      TZ: Asia/Tokyo
      MASTODON_ACCESS_TOKEN:
      MASTODON_SERVER_URL:
      MASTODON_STREAM: direct
      MQ_HOST: amqp://mq
      MQ_USERNAME: shiko
      MQ_PASSWORD: shiko
      PORT: 80
      LOG_LEVEL: debug
    deploy:
      replicas: 2
    user: "65534"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - type: bind
        source: ./supplier
        target: /usr/src/app

  reactor:
    build:
      context: ./reactor
      target: build
    command: ./reactor
    environment:
      USER_ID: 1
      TZ: Asia/Tokyo
      DB_HOST: database
      DB_DATABASE: ejaculation
      DB_USERNAME: shiko
      DB_PASSWORD: shiko
      DB_SSL_MODE: disable
      MASTODON_USER_ID:
      MASTODON_ACCESS_TOKEN:
      MASTODON_SERVER_URL:
      MQ_HOST: amqp://mq
      MQ_USERNAME: shiko
      MQ_PASSWORD: shiko
      EXT_MPYW_API_URL:
      PORT: 80
      LOG_LEVEL: debug
    deploy:
      replicas: 2
    user: "65534"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - type: bind
        source: ./reactor
        target: /usr/src/app

  web:
    image: nginx/nginx-unprivileged:1.31
    ports:
      - "${COUNTER_PORT-8080}:80"
    environment:
      REACTOR_HOST: reactor
      GF_HOST: grafana
    user: "101"
    group_add:
      - "0"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - type: bind
        source: ./web/public
        target: /var/www/html
      - type: tmpfs
        target: /etc/nginx/conf.d
      - type: bind
        source: ./web/conf
        target: /etc/nginx/templates
      - type: tmpfs
        target: /tmp

  grafana:
    build:
      context: ./grafana
    environment:
      TZ:
      GF_AUTH_ANONYMOUS_ENABLED: 1
      GF_SECURITY_ALLOW_EMBEDDING: 1
      GF_SERVER_ENABLE_GZIP: 1
      GF_SERVER_SERVE_FROM_SUB_PATH: 1
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana"
      GF_SERVER_DOMAIN: grafana
      POSTGRES_URL: database
      POSTGRES_DB: ejaculation
      POSTGRES_USER: shiko
      POSTGRES_PASSWORD: shiko
      POSTGRES_SSLMODE: disable
    user: "472"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - type: bind
        source: ./grafana/dashboards
        target: /etc/grafana/provisioning/dashboards
      - type: bind
        source: ./grafana/datasources
        target: /etc/grafana/provisioning/datasources
      - type: volume
        source: grafana
        target: /var/lib/grafana
      - type: tmpfs
        target: /var/log/grafana
      - type: tmpfs
        target: /tmp

  mq:
    build:
      context: ./mq
    environment:
      RABBITMQ_DEFAULT_USER: shiko
      RABBITMQ_DEFAULT_PASS: shiko
    user: "999"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - type: volume
        source: mq
        target: /var/lib/rabbitmq

  database:
    image: postgres:18.6
    environment:
      TZ:
      POSTGRES_DB: ejaculation
      POSTGRES_USER: shiko
      POSTGRES_PASSWORD: shiko
    user: "999"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - type: bind
        source: ./database
        target: /docker-entrypoint-initdb.d
      - type: tmpfs
        target: /run/postgresql
      - type: tmpfs
        target: /tmp
      - type: volume
        source: database
        target: /var/lib/postgresql

volumes:
  grafana:
    driver: local
  mq:
    driver: local
  database:
    driver: local
